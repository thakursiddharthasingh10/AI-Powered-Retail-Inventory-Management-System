version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: retail-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-retail_db}
      MYSQL_USER: ${MYSQL_USER:-retail_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-retail_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_indexes_constraints.sql:/docker-entrypoint-initdb.d/02_indexes_constraints.sql:ro
      - ./database/03_seed_demo_data.sql:/docker-entrypoint-initdb.d/03_seed_demo_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - retail-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-retail_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-retail_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-retail_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      AI_SERVICE_URL: http://ai-service:8000
      APP_AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    networks:
      - retail-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: retail-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    networks:
      - retail-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - retail-network

volumes:
  mysql_data:

networks:
  retail-network:
    driver: bridge